# au-d77 --- FreeBSD 14.5 + rc.d, Wasp Wayland
#
# Install intent mirrors au-d77's own installer
# (config/overlay/usr/local/bin/au-d77-install in ~/Remaster/au-d77), which,
# like Mocinha, copies the running live system (tar --one-file-system from /).
# Live-session artifacts are declared below so they do not reach the target.

[system]
id = "au-d77"
name = "au-d77 FreeBSD Live"
version = "14.5"
arch = "x86_64"
platform = "freebsd"

[install]
# The live root is a plain UFS filesystem (label AU_D77_LIVE), copied as a tree
method = "tree-copy"
source = "/"
min_disk_size_bytes = 10737418240
# au-d77-install: GPT (BIOS bootcode + ESP) for both firmwares, UFS2 SU+J root
partition_table = "gpt"
root_filesystem = "ufs"
root_label = "AU_D77_ROOT"
root_mount_options = "rw,noatime"
esp_size = "200m"
esp_mountpoint = "/boot/efi"
esp_mount_options = "rw"
# au-d77-install scales swap with disk size (1g <16 GB, 2g <35 GB, else 4g)
swap_size = "2g"
exclude = ["./var/cache/pkg/*"]
fstab_extra = [
    "tmpfs                    /tmp            tmpfs   rw,mode=1777    0       0",
    "devfs                    /dev            devfs   rw              0       0",
]

[providers]
platform = "freebsd"
storage = "freebsd-gpart"
filesystem = "freebsd-newfs"
deployment = "tree-copy"
users = "pw"
initramfs = "none"
services = "freebsd-rc"
sysconfig = "freebsd-rc"

[boot]
available = ["freebsd-loader"]
default = "freebsd-loader"

[services]
# Enabled in the live /etc/rc.conf and kept by au-d77-install
required = ['devd', 'devmatch', 'powerd', 'seatd', 'dbus', 'wpa_supplicant', 'clear_tmp', 'ntpd']

[users]
# au-d77-install: pw useradd -s /bin/sh -G wheel,operator,video
groups = ["wheel", "operator", "video"]
shell = "/bin/sh"

[live_only]
# Live session account (autologin on ttyv0 into Wasp)
users = ["d77"]
files = [
    # passwordless sudo for the live user
    "/usr/local/etc/sudoers.d/10-live",
]

# Root filesystem by the installed label instead of the live one
[[target_files]]
path = "/boot/loader.conf"
mode = "0644"
content = '''
# au-d77 boot loader configuration
autoboot_delay="3"
# beastie_disable="NO" enables the standard FreeBSD numeric boot menu (Single-User recovery)
beastie_disable="NO"
loader_logo="none"
loader_menu_multi_user_prompt="au-d77 Live Desktop"

# Asynchronous / devd driver loading
hw.usb.no_boot_wait="1"

# Temporary memory filesystem
tmpfs_load="YES"

# Direct live root mount by filesystem label
vfs.root.mountfrom="ufs:/dev/ufs/AU_D77_ROOT"

# Console output on both internal display and serial port
boot_multicons="YES"
console="vidconsole,comconsole"
comconsole_speed="115200"
'''

# Live rc.conf with au-d77-install's sysrc changes (tmpmfs, dumpdev); hostname is set by Mocinha
[[target_files]]
path = "/etc/rc.conf"
mode = "0644"
content = '''
# au-d77 base system configuration
hostname="au-d77"

# Hardware and device management
devd_enable="YES"
devmatch_enable="YES"
powerd_enable="YES"

# Seat management for unprivileged Wayland compositors
seatd_enable="YES"

# Inter-process communication
dbus_enable="YES"

# Devfs rules for Wayland / DRM access
devfs_system_ruleset="localrules"

# GPU & KMS auto-detection (Intel, AMD, Radeon) + sound drivers + common wireless drivers
kld_list="i915kms amdgpu radeonkms snd_hda snd_uaudio if_ath if_iwm if_iwn if_rtwn_pci if_rtwn_usb if_run if_urtw if_uath if_otus if_ral if_rsu"

# Networking: DHCP for Ethernet and native wlan0 configuration
ifconfig_DEFAULT="DHCP"
create_args_wlan0="country PT regdomain ETSI"
ifconfig_wlan0="WPA DHCP"
wpa_supplicant_enable="YES"

# Memory filesystem sizing for live sessions
tmpmfs="NO"
tmpsize="1024m"

# System cleanliness and time
clear_tmp_enable="YES"
ntpd_enable="YES"
ntpd_sync_on_start="YES"

# Disable crash dumps on live media
dumpdev="AUTO"
'''

# Console insecure (single-user asks for the root password); no autologin of the live user
[[target_files]]
path = "/etc/ttys"
mode = "0644"
content = '''
#
#	@(#)ttys	5.1 (Berkeley) 4/17/89
#
# This file specifies various information about terminals on the system.
# It is used by several different programs.  Common entries for the
# various columns include:
#
# name  The name of the terminal device.
#
# getty The program to start running on the terminal.  Typically a
#       getty program, as the name implies.  Other common entries
#       include none, when no getty is needed, and xdm, to start the
#       X Window System.
#
# type The initial terminal type for this port.  For hardwired
#      terminal lines, this will contain the type of terminal used.
#      For virtual consoles, the correct type is typically xterm.
#      Other common values include dialup for incoming modem ports, and
#      unknown when the terminal type cannot be predetermined.
#
# status Must be on or off.  If on, init will run the getty program on
#        the specified port.  If the word "secure" appears, this tty
#        allows root login.
#
# name	getty				type	status		comments
#
# If console is marked "insecure", then init will ask for the root password
# when going to single-user mode.
console	none				unknown	off insecure
#
ttyv0	"/usr/libexec/getty Pc"	xterm	onifexists secure
# Virtual terminals
ttyv1	"/usr/libexec/getty Pc"		xterm	onifexists secure
ttyv2	"/usr/libexec/getty Pc"		xterm	onifexists secure
ttyv3	"/usr/libexec/getty Pc"		xterm	onifexists secure
ttyv4	"/usr/libexec/getty Pc"		xterm	onifexists secure
ttyv5	"/usr/libexec/getty Pc"		xterm	onifexists secure
ttyv6	"/usr/libexec/getty Pc"		xterm	onifexists secure
ttyv7	"/usr/libexec/getty Pc"		xterm	onifexists secure
ttyv8	"/usr/local/bin/xdm -nodaemon"	xterm	off secure
# Serial terminals
# The 'dialup' keyword identifies dialin lines to login, fingerd etc.
ttyu0	"/usr/libexec/getty 3wire"	vt100	onifconsole secure
ttyu1	"/usr/libexec/getty 3wire"	vt100	onifconsole secure
ttyu2	"/usr/libexec/getty 3wire"	vt100	onifconsole secure
ttyu3	"/usr/libexec/getty 3wire"	vt100	onifconsole secure
# Dumb console
dcons	"/usr/libexec/getty std.115200"	vt100	off secure
# Xen Virtual console
xc0	"/usr/libexec/getty Pc"		xterm	onifconsole secure
# RISC-V HTIF console
rcons	"/usr/libexec/getty std.115200"	vt100	onifconsole secure
'''

[[target_files]]
path = "/usr/local/etc/sudoers.d/10-wheel"
mode = "0440"
content = """%wheel ALL=(ALL:ALL) ALL
"""

[[target_files]]
path = "/usr/local/etc/doas.conf"
mode = "0600"
content = """permit persist :wheel
"""
