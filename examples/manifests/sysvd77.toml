# sysvd77 --- CRUX + sysvinit
#
# DRAFT, NOT DERIVED FROM THE sysvd77 REMASTER YET. Kept valid so the CRUX
# providers can be unit-tested; it will be rewritten from sysvd77's own
# installer before any sysvd77 validation (as done for btw-d77 and au-d77).

[system]
id = "sysvd77"
name = "sysvd77 CRUX Live"
version = "3.7"
arch = "x86_64"
platform = "linux"

[install]
method = "rsync"
source = "/"
min_disk_size_bytes = 8589934592
root_filesystem = "ext4"
root_mount_options = "rw,relatime"
esp_size = "512m"
esp_mountpoint = "/boot"
esp_mount_options = "rw"

[providers]
platform = "linux"
storage = "linux-sfdisk"
filesystem = "linux-mkfs"
deployment = "rsync-copy"
users = "shadow"
initramfs = "none"
services = "crux-sysvinit"

[boot]
available = ["limine", "lilo", "grub"]
default = "limine"

[services]
required = ["syslog"]
default_enabled = ["net"]
optional = ["sshd"]
live_only = ["live-setup"]
