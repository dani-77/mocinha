# btw-d77 --- Arch Linux + systemd, Qtile on Wayland (greetd)
#
# Install intent mirrors btw-d77's own installer (airootfs/usr/local/bin/d77-install
# + airootfs/root/d77-archinstall.json in ~/Remaster/btw-d77). That installer
# builds the target with pacstrap, so the live's own setup never reaches it;
# Mocinha copies the live, so everything below that exists only for the live
# session must be declared and removed.

[system]
id = "btw-d77"
name = "btw-d77 Arch Linux Live"
version = "2026.10"
arch = "x86_64"
platform = "linux"

[install]
method = "squashfs"
source = "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
min_disk_size_bytes = 10737418240
# d77-install: mkfs.ext4 -L root, ESP 1 GiB mkfs.fat -n EFI mounted at /boot;
# mount options as written by genfstab (archinstall)
root_filesystem = "ext4"
root_label = "root"
root_mount_options = "rw,relatime"
esp_size = "1g"
esp_label = "EFI"
esp_mountpoint = "/boot"
esp_mount_options = "rw,relatime,fmask=0022,dmask=0022,codepage=437,iocharset=ascii,shortname=mixed,utf8,errors=remount-ro"

[providers]
platform = "linux"
storage = "linux-sfdisk"
filesystem = "linux-mkfs"
deployment = "squashfs-extract"
users = "shadow"
initramfs = "mkinitcpio"
services = "arch-systemd"
sysconfig = "systemd"
online = "pacman"

[boot]
# The live ships grub + efibootmgr only (packages.x86_64), as d77-install uses GRUB.
available = ["grub"]
default = "grub"

[services]
# d77-install: systemctl set-default graphical.target
default_target = "graphical.target"
# d77-archinstall.json "services" + archinstall ntp=true (systemd-timesyncd)
required = ["greetd", "NetworkManager", "systemd-timesyncd"]
default_enabled = []
# Installed and enabled in the live, not enabled by d77-install
optional = ["sshd", "iwd"]
# Enabled in the live overlay (airootfs/etc/systemd/system/*.wants) for the live
# session only. Units whose package is not installed only leave dangling links.
live_only = [
    "choose-mirror", "pacman-init", "livecd-talk", "livecd-alsa-unmuter", "reflector",
    "systemd-networkd", "systemd-networkd-wait-online", "systemd-resolved",
    "systemd-time-wait-sync", "pcscd.socket", "ModemManager",
    "hv_fcopy_daemon", "hv_kvp_daemon", "hv_vss_daemon",
    "vboxservice", "vmtoolsd", "vmware-vmblock-fuse",
    "cloud-config", "cloud-final", "cloud-init-local", "cloud-init-main", "cloud-init-network",
]

[users]
# wheel: sudo for the user (archinstall "sudo": true); storage: d77-archinstall.json custom-commands
groups = ["wheel", "storage"]

[services.metadata.NetworkManager]
conflicts = ["systemd-networkd", "dhcpcd"]

[live_only]
# Live session account (autologin into Qtile via greetd [initial_session])
users = ["live"]
files = [
    # root autologin on tty1 and archiso SSH root login
    "/etc/systemd/system/getty@tty1.service.d/autologin.conf",
    "/etc/ssh/sshd_config.d/10-archiso.conf",
    # live helper units and their drop-ins
    "/etc/systemd/system/choose-mirror.service",
    "/etc/systemd/system/pacman-init.service",
    "/etc/systemd/system/livecd-talk.service",
    "/etc/systemd/system/livecd-alsa-unmuter.service",
    "/etc/systemd/system/etc-pacman.d-gnupg.mount",
    "/etc/systemd/system/reflector.service.d/archiso.conf",
    "/etc/systemd/system/systemd-networkd-wait-online.service.d/wait-for-only-one-interface.conf",
    "/etc/systemd/system/dbus-org.freedesktop.ModemManager1.service",
    "/etc/systemd/system/dbus-org.freedesktop.network1.service",
    "/etc/systemd/system/dbus-org.freedesktop.resolve1.service",
    "/etc/systemd/system-generators/systemd-gpt-auto-generator",
    # live-session systemd configuration (volatile journal, no suspend, networkd/resolved)
    "/etc/systemd/journald.conf.d/volatile-storage.conf",
    "/etc/systemd/logind.conf.d/do-not-suspend.conf",
    "/etc/systemd/network/20-ethernet.network",
    "/etc/systemd/network/20-wlan.network",
    "/etc/systemd/network/20-wwan.network",
    "/etc/systemd/networkd.conf.d/ipv6-privacy-extensions.conf",
    "/etc/systemd/resolved.conf.d/archiso.conf",
    # archiso initramfs drop-in (the stock preset is restored by the mkinitcpio provider)
    "/etc/mkinitcpio.conf.d/archiso.conf",
    # archiso root session and live installer
    "/root/.automated_script.sh",
    "/root/.zlogin",
    "/root/.gnupg",
    "/root/d77-archinstall.json",
    "/usr/local/bin/choose-mirror",
    "/usr/local/bin/livecd-sound",
    "/usr/local/bin/Installation_guide",
    "/usr/local/bin/d77-install",
    "/usr/local/share/livecd-sound",
]

# Installed greetd configuration, as written by d77-archinstall.json custom-commands
[[target_files]]
path = "/etc/greetd/config.toml"
mode = "0644"
content = '''
# btw-d77 installed: greeter-only, no autologin. Session is the same
# /usr/local/bin/qtile-session used on the live ISO (Qtile on wlroots).
[terminal]
vt = 1

[default_session]
command = "agreety --cmd /usr/local/bin/qtile-session"
user = "greeter"
'''

# Live sudoers without the live user's rule
[[target_files]]
path = "/etc/sudoers"
mode = "0440"
content = '''
## sudoers file.
##
## This file MUST be edited with the 'visudo' command as root.
## Failure to use 'visudo' may result in syntax or file permission errors
## that prevent sudo from running.
##
## See the sudoers man page for the details on how to write a sudoers file.
##

##
## Host alias specification
##
## Groups of machines. These may include host names (optionally with wildcards),
## IP addresses, network numbers or netgroups.
# Host_Alias	WEBSERVERS = www1, www2, www3

##
## User alias specification
##
## Groups of users.  These may consist of user names, uids, Unix groups,
## or netgroups.
# User_Alias	ADMINS = millert, dowdy, mikef

##
## Cmnd alias specification
##
## Groups of commands.  Often used to group related commands together.
# Cmnd_Alias	PROCESSES = /usr/bin/nice, /bin/kill, /usr/bin/renice, \
# 			    /usr/bin/pkill, /usr/bin/top
#
# Cmnd_Alias	REBOOT = /sbin/halt, /sbin/reboot, /sbin/poweroff
#
# Cmnd_Alias	DEBUGGERS = /usr/bin/gdb, /usr/bin/lldb, /usr/bin/strace, \
# 			    /usr/bin/truss, /usr/bin/bpftrace, \
# 			    /usr/bin/dtrace, /usr/bin/dtruss
#
# Cmnd_Alias	PKGMAN = /usr/bin/apt, /usr/bin/dpkg, /usr/bin/rpm, \
# 			 /usr/bin/yum, /usr/bin/dnf,  /usr/bin/zypper, \
# 			 /usr/bin/pacman

##
## Defaults specification
##
## Preserve editor environment variables for visudo.
## To preserve these for all commands, remove the "!visudo" qualifier.
Defaults!/usr/bin/visudo env_keep += "SUDO_EDITOR EDITOR VISUAL"
##
## Use a hard-coded PATH instead of the user's to find commands.
## This also helps prevent poorly written scripts from running
## arbitrary commands under sudo.
Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/bin"
##
## You may wish to keep some of the following environment variables
## when running commands via sudo.
##
## Locale settings
# Defaults env_keep += "LANG LANGUAGE LINGUAS LC_* _XKB_CHARSET"
##
## Run X applications through sudo; HOME is used to find the
## .Xauthority file.  Note that other programs use HOME to find   
## configuration files and this may lead to privilege escalation!
# Defaults env_keep += "HOME"
##
## X11 resource path settings
# Defaults env_keep += "XAPPLRESDIR XFILESEARCHPATH XUSERFILESEARCHPATH"
##
## Desktop path settings
# Defaults env_keep += "QTDIR KDEDIR"
##
## Allow sudo-run commands to inherit the callers' ConsoleKit session
# Defaults env_keep += "XDG_SESSION_COOKIE"
##
## Uncomment to enable special input methods.  Care should be taken as
## this may allow users to subvert the command being run via sudo.
# Defaults env_keep += "XMODIFIERS GTK_IM_MODULE QT_IM_MODULE QT_IM_SWITCHER"
##
## Uncomment to disable "use_pty" when running commands as root.
## Commands run as non-root users will run in a pseudo-terminal,
## not the user's own terminal, to prevent command injection.
# Defaults>root !use_pty
##
## Uncomment to run commands in the background by default.
## This can be used to prevent sudo from consuming user input while
## a non-interactive command runs if "use_pty" or I/O logging are
## enabled.  Some commands may not run properly in the background.
# Defaults exec_background
##
## Uncomment to send mail if the user does not enter the correct password.
# Defaults mail_badpass
##
## Uncomment to enable logging of a command's output, except for
## sudoreplay and reboot.  Use sudoreplay to play back logged sessions.
## Sudo will create up to 2,176,782,336 I/O logs before recycling them.
## Set maxseq to a smaller number if you don't have unlimited disk space.
# Defaults log_output
# Defaults!/usr/bin/sudoreplay !log_output
# Defaults!/usr/local/bin/sudoreplay !log_output
# Defaults!REBOOT !log_output
# Defaults maxseq = 1000
##
## Uncomment to disable intercept and log_subcmds for debuggers and
## tracers.  Otherwise, anything that uses ptrace(2) will be unable
## to run under sudo if intercept_type is set to "trace".
# Defaults!DEBUGGERS !intercept, !log_subcmds
##
## Uncomment to disable intercept and log_subcmds for package managers.
## Some package scripts run a huge number of commands, which is made
## slower by these options and also can clutter up the logs.
# Defaults!PKGMAN !intercept, !log_subcmds
##
## Uncomment to disable PAM silent mode.  Otherwise messages by PAM
## modules such as pam_faillock will not be printed.
# Defaults !pam_silent

##
## Runas alias specification
##

##
## User privilege specification
##
root ALL=(ALL:ALL) ALL
## Uncomment to allow members of group wheel to execute any command
# %wheel ALL=(ALL:ALL) ALL

## Same thing without a password
# %wheel ALL=(ALL:ALL) NOPASSWD: ALL

## Uncomment to allow members of group sudo to execute any command
# %sudo ALL=(ALL:ALL) ALL

## Uncomment to allow any user to run sudo if they know the password
## of the user they are running the command as (root by default).
# Defaults targetpw  # Ask for the password of the target user
# ALL ALL=(ALL:ALL) ALL  # WARNING: only use this together with 'Defaults targetpw'

## Read drop-in files from /etc/sudoers.d
@includedir /etc/sudoers.d
'''

# Administrator rule for group wheel (archinstall grants sudo to the user)
[[target_files]]
path = "/etc/sudoers.d/10-wheel"
mode = "0440"
content = """%wheel ALL=(ALL:ALL) ALL
"""

# The live links /etc/resolv.conf to the systemd-resolved stub (resolved is live-only).
# A regular file, as shipped by Arch's filesystem package, lets NetworkManager manage it;
# deleting it instead makes systemd-tmpfiles recreate the stub symlink at boot.
[[target_files]]
path = "/etc/resolv.conf"
mode = "0644"
content = '''
# Resolver configuration file.
# See resolv.conf(5) for details.
'''

# The live motd advertises d77-install/archinstall
[[target_files]]
path = "/etc/motd"
mode = "0644"
content = ""

# Online components: what d77-install's archinstall custom-commands fetch.
# d77-install adds [custom] and [chaotic-aur] to the target's pacman.conf and
# runs "pacman -S d77-qtile-skel d77-grub-theme qtile-extras arc-gtk-theme
# nwg-launchers otf-font-awesome-4 ttf-font-awesome-4" (with "|| true": a
# network failure there is silent; here it stops the install), then sets
# GRUB_THEME. The live already has both repositories in its pacman.conf and
# all of these packages except d77-qtile-skel and d77-grub-theme.
[online]
optional = true        # the user may install offline (no GRUB theme, live skel)
upgrade = true         # d77-install pacstraps current packages; no partial upgrade
packages = [
    "d77-qtile-skel", "d77-grub-theme", "qtile-extras", "arc-gtk-theme",
    "nwg-launchers", "otf-font-awesome-4", "ttf-font-awesome-4",
]
# The live already holds most of d77-qtile-skel's files, copied from its
# airootfs and owned by no package: 234 under /etc/skel plus the 9 below
# (computed by comparing the package's file list with airootfs). The
# package takes them over; nothing else may be overwritten.
overwrite = [
    "/etc/skel/*",
    "/etc/polkit-1/rules.d/50-udisks.rules",
    "/usr/local/bin/fuzzel-power-menu",
    "/usr/local/bin/power_menu",
    "/usr/local/bin/qtile-session",
    "/usr/local/bin/rofi-power-menu",
    "/usr/local/bin/screenlock",
    "/usr/local/bin/wswap-X",
    "/usr/local/bin/wswap-way",
    "/usr/share/pixmaps/d77void.png",
]

[[online.repositories]]
name = "custom"
servers = ["https://raw.githubusercontent.com/dani-77/d77-iso/main"]
siglevel = "Optional TrustAll"

[[online.repositories]]
name = "chaotic-aur"
servers = ["https://geo-mirror.chaotic.cx/$repo/$arch", "https://cdn-mirror.chaotic.cx/$repo/$arch"]
siglevel = "Never"

[online.grub_defaults]
GRUB_THEME = "/boot/grub/themes/d77-grub-theme/theme.txt"
